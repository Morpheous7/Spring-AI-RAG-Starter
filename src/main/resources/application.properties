spring.application.name=spring-ai-rag-starter

# Railway injects PORT; default to 8080 locally
server.port=${PORT:8080}

# Postgres + pgvector. Railway's Postgres services expose PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}

# Vector store: created on first start; 384 dims matches the local all-MiniLM-L6-v2 embedding model
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# Set RESET_VECTOR_STORE=true for one deploy to drop and recreate the table (deletes all stored documents)
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=${RESET_VECTOR_STORE:false}

# Embeddings: always local ONNX. The model (~90 MB) downloads once and is cached.
spring.ai.model.embedding=transformers
spring.ai.embedding.transformer.cache.directory=${MODEL_CACHE_DIR:/tmp/spring-ai-onnx-model}

# Answer generation: off unless AI_CHAT=openai (and OPENAI_API_KEY is set).
# With it off, /api/ask returns the best-matching passages instead of a written answer.
spring.ai.model.chat=${AI_CHAT:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}

# The OpenAI starter also offers these models; this app doesn't use them
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

# Optional write/ask protection: set APP_API_KEY and send it as the X-API-Key header
app.api-key=${APP_API_KEY:}
app.seed-sample=${SEED_SAMPLE:true}
app.search.top-k=${SEARCH_TOP_K:4}
app.search.similarity-threshold=${SEARCH_SIMILARITY_THRESHOLD:0.0}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Send error reasons (e.g. "Only .pdf, .txt and .md files are accepted.") to the client
# Error bodies come from rag/ApiErrors.java

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
